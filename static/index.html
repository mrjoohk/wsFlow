<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wsFlow</title>
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --fg:#1f2328; --muted:#6b7280; --line:#e2dfd7; --accent:#2f5d8a; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --chip:#eef2f7; }
  * { box-sizing:border-box; }
  .hlabel[hidden] { display:none; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:.6rem; align-items:center; padding:.5rem .9rem; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0 .6rem 0 0; }
  main { flex:1; display:grid; grid-template-columns:300px 1fr; min-height:0; }
  aside { border-right:1px solid var(--line); background:var(--panel); overflow:auto; }
  section#content { overflow:auto; padding:1rem 1.2rem; }
  button { font:inherit; padding:.28rem .7rem; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; }
  button:hover { border-color:var(--accent); } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  /* danger = 이 PC 밖에 쓰거나(push·Jira) 덮어쓰는(배포) 동작, 그리고 제거. primary 는 패널당 하나 — 앞으로 가는 동작. */
  button.danger { background:var(--bad); color:#fff; border-color:var(--bad); } button.danger:hover { border-color:#7f1d1d; background:#a51616; }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button.hasBad { border-color:var(--bad); color:var(--bad); font-weight:600; }
  input, select, textarea { font:inherit; padding:.28rem .5rem; border:1px solid var(--line); border-radius:5px; background:#fff; }
  input[type=text] { min-width:14rem; } textarea { width:100%; min-height:6rem; font-family:ui-monospace,Consolas,monospace; font-size:.9rem; }
  .panel { border:1px solid var(--line); border-radius:6px; padding:.7rem .9rem; background:#fbfaf7; }
  .panel h3 { margin:.1rem 0 .6rem; font-size:.95rem; }
  .panel label { margin-right:.7rem; white-space:nowrap; }
  .card { padding:.55rem .8rem; border-bottom:1px solid var(--line); cursor:pointer; display:flex; flex-direction:column; gap:.15rem; }
  .card:hover { background:#f8f7f3; } .card.active { background:#eaf1f8; border-left:3px solid var(--accent); }
  .card .row { display:flex; justify-content:space-between; align-items:center; gap:.4rem; }
  .card .name { font-weight:600; } .card .path { color:var(--muted); font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .x { border:none; background:none; color:var(--muted); padding:0 .2rem; } .card .x:hover { color:var(--bad); }
  .chip { display:inline-block; padding:0 .45rem; border-radius:999px; font-size:.84rem; background:var(--chip); margin-right:.15rem; white-space:nowrap; }
  .chip.bad { background:#fde8e8; color:var(--bad); } .chip.warn { background:#fdf0e1; color:var(--warn); } .chip.ok { background:#e5f5ea; color:var(--ok); }
  .tabs { display:flex; gap:.2rem; border-bottom:1px solid var(--line); margin-bottom:1rem; }
  .tabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; padding:.4rem .8rem; }
  .tabs button.on { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
  .tblwrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:.86rem; } table textarea { min-height:2.8rem; } th, td { border:1px solid var(--line); padding:.3rem .5rem; text-align:left; vertical-align:top; } th { background:#f1efe9; }
  tr.click:hover { background:#f8f7f3; cursor:pointer; }
  pre { background:#f1efe9; padding:.6rem .8rem; border-radius:6px; font-size:.82rem; white-space:pre-wrap; word-break:break-all; max-height:20rem; overflow:auto; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:.8rem 1rem; margin-bottom:1rem; }
  .box h3 { margin:0 0 .5rem; font-size:.95rem; } .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  .filelist { max-height:16rem; overflow:auto; font-family:ui-monospace,Consolas,monospace; font-size:.82rem; }
  .filelist label { display:block; padding:.05rem 0; } .code { display:inline-block; width:1.2rem; color:var(--muted); }
  .muted { color:var(--muted); } .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  button.linkish { border:none; background:none; color:var(--accent); padding:0 .2rem; text-decoration:underline; }
  .chip[data-tab] { cursor:pointer; } .chip[data-tab]:hover { outline:1px solid var(--accent); }
  #toast { position:fixed; right:1rem; bottom:1rem; background:#1f2328; color:#fff; padding:.5rem .9rem; border-radius:6px; opacity:0; transition:opacity .2s; max-width:40rem; white-space:pre-wrap; z-index:20; }
  #toast.show { opacity:.95; }
  dialog { border:1px solid var(--line); border-radius:8px; padding:1rem 1.2rem; width:min(820px,92vw); max-height:85vh; }
  dialog::backdrop { background:rgba(0,0,0,.25); }
  .actions { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; margin:.4rem 0; }
  /* 헤더 — 세 무리(추가 · 도구 · 이동)로 접는다. 14개 평면 나열은 무엇이 중요한지 말해 주지 않는다. */
  .hlabel { display:inline-flex; align-items:center; gap:.35rem; color:var(--muted); font-size:.85rem; }
  .hlabel select { max-width:22rem; }
  details.menu { position:relative; }
  details.menu > summary { list-style:none; cursor:pointer; padding:.28rem .7rem; border:1px solid var(--line); border-radius:5px; background:#fff; user-select:none; }
  details.menu > summary::-webkit-details-marker { display:none; } details.menu > summary::after { content:" ▾"; color:var(--muted); }
  details.menu[open] > summary { border-color:var(--accent); }
  .menuBody { position:absolute; top:calc(100% + .3rem); left:0; z-index:15; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 20px rgba(0,0,0,.12); padding:.5rem .7rem; min-width:34rem; display:flex; flex-direction:column; gap:.4rem; }
  .menuRow { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; } .menuRow > b { min-width:6.5rem; font-weight:600; font-size:.85rem; color:var(--muted); }
  .menuRow.sep { border-top:1px solid var(--line); padding-top:.5rem; margin-top:.2rem; }
  .menuRow input[type=text] { min-width:10rem; flex:1; }
  button.nav.on { border-color:var(--accent); color:var(--accent); font-weight:600; background:#eaf1f8; }
  .calendar-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,350px); gap:1rem; align-items:start; }
  .calendar-toolbar { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin:.6rem 0; }
  .cal-week { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
  .cal-week [role=columnheader] { text-align:center; padding:.4rem; color:var(--muted); }
  .cal-day { min-width:0; min-height:128px; text-align:left; border-radius:0; padding:.4rem; display:flex; flex-direction:column; gap:.25rem; background:var(--panel); }
  .cal-day.outside { background:#f0efeb; color:var(--muted); }
  .cal-day[aria-selected=true] { background:#eaf1f8; box-shadow:inset 0 0 0 2px var(--accent); }
  .cal-day.today .cal-date { text-decoration:underline; font-weight:700; }
  .cal-event { display:block; border-left:3px solid var(--accent); padding-left:.3rem; font-size:.77rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .cal-counts { margin-top:auto; font-size:.72rem; color:var(--muted); }
  .cal-detail { min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:1rem; }
  .cal-detail h3 { margin:.8rem 0 .4rem; font-size:.95rem; }
  .cal-entry { border-top:1px solid var(--line); padding:.6rem 0; overflow-wrap:anywhere; }
  .cal-entry p { margin:.25rem 0; white-space:pre-wrap; }
  #calendarEditor label { display:block; margin:.5rem 0; } #calendarEditor input:not([type=checkbox]), #calendarEditor select { max-width:100%; }
  #calendarEditor [data-field=title] { width:100%; } .cal-editor-times { display:flex; flex-wrap:wrap; gap:.7rem; }
  @media(max-width:1150px){ .calendar-layout{grid-template-columns:1fr;} }
  @media(max-width:600px){ .cal-day{min-height:112px;padding:.25rem;} .cal-counts{font-size:.65rem;} section#content{padding:.65rem;} .cal-event{font-size:.7rem;} }
  @media (max-width:800px){ main{grid-template-columns:1fr;} aside{max-height:35vh;} }
</style>
</head>
<body>
<header>
  <h1>wsFlow</h1>
  <label class="hlabel">루트 <select id="rootSel" title="워크스페이스 루트 — 스캔·새 프로젝트·배포의 기준 폴더"></select></label>
  <details class="menu" id="menuAdd">
    <summary>＋ 추가</summary>
    <div class="menuBody">
      <div class="menuRow"><b>루트에서 찾기</b><button id="btnScan" title="선택한 루트 아래 폴더를 나열해 등록">루트 스캔…</button></div>
      <div class="menuRow"><b>루트 추가</b><input type="text" id="rootInput" placeholder="경로 (예: K:\01.workspace\AI_workspace)"><button id="btnPickRoot" title="탐색기에서 폴더를 골라 루트로 추가">찾아보기…</button><button id="btnAddRoot">추가</button></div>
      <div class="menuRow"><b>프로젝트 등록</b><input type="text" id="projInput" placeholder="프로젝트 폴더 경로"><button id="btnPickProj" title="탐색기에서 폴더를 골라 프로젝트로 등록">찾아보기…</button><button id="btnAddProj">등록</button></div>
      <div class="menuRow"><b>새 프로젝트</b><button id="btnNewProj" title="선택한 루트 아래에 빈 프로젝트 폴더를 만들고 등록">빈 폴더 만들기…</button></div>
      <div class="menuRow sep"><b>루트 관리</b><button id="btnDelRoot" class="danger" title="선택한 루트를 목록에서 제거(폴더는 그대로)">선택한 루트 제거</button></div>
    </div>
  </details>
  <details class="menu" id="menuTools">
    <summary>도구</summary>
    <div class="menuBody">
      <div class="menuRow"><button id="btnDeploy" title="폴더/파일을 체크한 프로젝트들에 복사(항상 덮어쓰기)">배포…</button><span class="muted">폴더/파일을 여러 프로젝트에 복사</span></div>
      <div class="menuRow"><button id="btnLocks" title="등록 저장소의 .git/*.lock 잔류 검사">lock 검사…</button><span class="muted">.git/*.lock 잔류 검사·정리</span></div>
    </div>
  </details>
  <button id="btnDash" class="nav">대시보드</button>
  <button id="btnCalendar" class="nav">캘린더</button>
  <button id="btnModules" class="nav">모듈 관리</button>
  <span id="moduleNavigation"></span>
  <span style="flex:1"></span>
  <button id="btnNotices" title="최근 알림·오류 다시 보기">알림</button>
  <button id="btnRefresh" title="목록과 현재 화면을 다시 읽습니다" aria-label="새로고침">↻</button>
</header>
<main>
  <aside id="list"></aside>
  <section id="content"><p class="muted">왼쪽에서 프로젝트를 고르거나, 루트를 추가하고 "루트 스캔"으로 등록하세요.</p></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state = { roots: [], projects: [], current: null, tab: "status", view: "project", jira: {} };

function moduleActive(id) { return !state.modules || state.modules.modules.some(m => m.id === id && m.active); }
function syncBuiltinNavigation() {
  const workspace=!!window.wsflowUI.get('workspace-operations'),calendar=!!window.wsflowUI.get('work-calendar');
  $('#menuAdd').hidden=!workspace;$('#menuTools').hidden=!workspace;
  $('#rootSel').closest('label').hidden=!workspace;$('#btnCalendar').hidden=!calendar;
}
async function refreshModuleState() {
  state.modules = await api('GET', '/api/v1/modules');
  syncBuiltinNavigation();
  const extensions = state.modules.modules.filter(m => m.active && !m.builtin && m.active_ui?.entry).map(m=>({...m,ui:m.active_ui}));
  $('#moduleNavigation').innerHTML = extensions.map((m,i) => `<button data-module-view="${i}">${esc(m.ui.label || m.name)}</button>`).join('');
  $('#moduleNavigation').querySelectorAll('[data-module-view]').forEach(b => b.onclick=()=>openModuleView(extensions[+b.dataset.moduleView]).catch(fail));
}

async function openModuleView(record) {
  state.view='extension';state.current=null;state.landed=true;renderList();
  const content=$('#content');content.innerHTML=`<h2>${esc(record.name)}</h2><div id="extensionView">불러오는 중…</div>`;
  const entry=record.ui.entry.split('/').map(encodeURIComponent).join('/');
  const view=await import(`/api/v1/modules/${encodeURIComponent(record.id)}/assets/${entry}?t=${encodeURIComponent(AUTH_TOKEN)}`);
  if(typeof view.mount!=='function')throw new Error('모듈 화면의 mount 계약이 없습니다');
  const target=$('#extensionView');if(!target)return;target.textContent='';
  await view.mount(target,(method,path,body)=>api(method,`/api/v1/modules/${encodeURIComponent(record.id)}/api/${String(path).replace(/^\//,'')}`,body));
}

async function renderModules() {
  state.view='modules';state.current=null;state.landed=true;renderList();
  await refreshModuleState();const snapshot=state.modules,c=$('#content');
  c.innerHTML=`<h2>통합 기능 모듈 관리</h2>
    <p>변경은 미리보기 후 예약하며 서버를 다시 실행하면 적용됩니다. 현재 실행 중인 구성과 다음 구성을 구분합니다.</p>
    ${snapshot.configuration_error?`<p class="bad" role="alert">${esc(snapshot.configuration_error)} · 저장 구성을 자동 초기화하지 않았습니다.</p>`:''}
    ${snapshot.storage_warning?`<p class="warn">${esc(snapshot.storage_warning)} · 기본 기능은 유지하며 모듈 구성 저장은 차단합니다.</p>`:''}
    <p id="moduleRevision">현재 실행 구성 ${snapshot.active_revision} · 저장 구성 ${snapshot.revision} · <strong>${snapshot.restart_required?'재시작 필요':'적용 대기 없음'}</strong></p>
    <div style="overflow:auto"><table><thead><tr><th>모듈</th><th>현재 실행</th><th>다음 실행</th><th>관리</th></tr></thead><tbody>
    ${snapshot.modules.map((m,i)=>`<tr data-module-id="${esc(m.id)}"><td><b>${esc(m.name)}</b><br><code>${esc(m.id)}</code>${m.error||state.moduleUIErrors?.[m.id]?`<p class="bad">${esc(m.error||state.moduleUIErrors[m.id])}</p>`:''}</td><td>${m.active?'활성':'비활성'} ${esc(m.active_version||'')}</td><td>${m.installed?(m.enabled?'활성':'비활성'):'제거'} ${esc(m.version)} ${m.pending?'· 재시작 대기':''}</td><td>${m.installed?`<button data-module-action="${m.enabled?'disable':'enable'}" data-module-index="${i}">${m.enabled?'비활성화':'활성화'}</button> <button data-module-action="configure" data-module-index="${i}">설정</button> <button data-module-action="uninstall" data-module-index="${i}">제거</button>`:m.builtin?`<button data-module-action="install" data-module-index="${i}">다시 추가</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>
    <details id="modulePackageForm" style="margin-top:1rem"><summary>로컬 모듈 패키지 추가·갱신·교체</summary>
      <p>신뢰한 로컬 코드만 선택하십시오. 패키지는 이 앱의 권한으로 실행됩니다. 설치 단계에서 외부 ERP에 연결하지 않습니다.</p>
      <label>작업 <select id="moduleAction"><option value="install">추가</option><option value="update">같은 모듈 버전 갱신</option><option value="replace">다른 구현으로 교체</option></select></label>
      <label>대상 모듈 <select id="moduleTarget"><option value="">추가 시 패키지에서 결정</option>${snapshot.modules.filter(m=>m.installed).map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select></label>
      <p><input id="moduleSource" type="text" placeholder="module.json이 있는 폴더의 절대 경로" style="width:min(38rem,80%)"> <button id="modulePick">찾아보기…</button></p>
      <label><input id="moduleTrusted" type="checkbox">선택한 패키지의 코드를 신뢰합니다</label>
      <p>초기 설정(JSON, 자격 원문 입력 금지)</p><textarea id="moduleInitialSettings" rows="3" style="width:min(38rem,95%)">{}</textarea>
      <p>다른 구현 교체는 기존 데이터를 보관하고 새 저장 공간을 사용합니다. 자동 업무 데이터 이관과 schema 변환은 지원하지 않습니다.</p><button id="modulePackagePreview">패키지 변경 미리보기</button>
    </details>
    <p><label>이전 구성 revision <input id="moduleRestoreRevision" type="number" min="0" step="1" value="${snapshot.active_revision}"></label> <button id="moduleRestore">이전 구성 복구 미리보기</button></p>
    <p>제거는 프로젝트 폴더·업무 기록·보호된 자격을 삭제하거나 외부 계정 권한을 철회하지 않습니다.</p>
    <div id="modulePlan"></div><p id="moduleStatus" role="status"></p>`;
  c.querySelectorAll('[data-module-action]').forEach(b=>b.onclick=async()=>{
    const m=snapshot.modules[+b.dataset.moduleIndex],action=b.dataset.moduleAction;
    if(action==='configure')return moduleSettingsDialog(m,snapshot.revision);
    await previewModuleChange({action,module_id:m.id,expected_revision:snapshot.revision});
  });
  $('#modulePick').onclick=async()=>{try{const r=await api('POST','/api/pick-folder',{});if(r.path)$('#moduleSource').value=r.path;}catch(e){fail(e);}};
  $('#modulePackagePreview').onclick=async()=>{try{const action=$('#moduleAction').value;const request={action,expected_revision:snapshot.revision,source_path:$('#moduleSource').value.trim(),trusted:$('#moduleTrusted').checked,settings:JSON.parse($('#moduleInitialSettings').value)};if(action!=='install')request.module_id=$('#moduleTarget').value;await previewModuleChange(request);}catch(e){$('#moduleStatus').textContent=e.message;}};
  $('#moduleRestore').onclick=()=>previewModuleChange({action:'restore',expected_revision:snapshot.revision,target_revision:Number($('#moduleRestoreRevision').value)});
}

async function moduleSettingsDialog(record,revision) {
  const dlg=$('#dlg');dlg.onclose=null;
  dlg.innerHTML=`<h3>${esc(record.name)} 설정</h3><p>선언 필드: ${esc(Object.keys(record.config_schema?.properties||{}).join(', ')||'없음')}</p><p>Jira·Google·프로젝트 설정은 기존 기능 화면에서 관리합니다.</p><textarea id="moduleSettings" rows="8" style="width:100%">${esc(JSON.stringify(record.settings||{},null,2))}</textarea><p id="moduleSettingsError" role="status"></p><button id="moduleSettingsPreview">설정 미리보기</button> <button id="moduleSettingsClose">닫기</button>`;
  $('#moduleSettingsClose').onclick=()=>dlg.close();
  $('#moduleSettingsPreview').onclick=async()=>{try{const settings=JSON.parse($('#moduleSettings').value);dlg.close();await previewModuleChange({action:'configure',module_id:record.id,settings,expected_revision:revision});}catch(e){if($('#moduleSettingsError'))$('#moduleSettingsError').textContent=e.message;}};
  dlg.showModal();
}

async function previewModuleChange(body) {
  const status=$('#moduleStatus'),box=$('#modulePlan');if(!status||!box)return;
  try {
    const plan=await api('POST','/api/v1/modules/plan',body);

      <div>${badges(p)}</div>
    </div>`).join("") || '<p class="muted" style="padding:1rem">등록된 프로젝트가 없습니다.</p>';
  $("#list").querySelectorAll(".card").forEach(c => c.onclick = e => { if (e.target.dataset.rm) return; select(c.dataset.id, e.target.dataset.tab || undefined); });
  $("#list").querySelectorAll(".chip[data-tab]").forEach(ch => ch.onkeydown = e => { if (e.key === "Enter") ch.click(); });
  $("#list").querySelectorAll("[data-rm]").forEach(b => b.onclick = async e => {
    e.stopPropagation(); const p = state.projects.find(x => x.id === b.dataset.rm);
    if (!await window.wsflowUI.guardUnsaved(p)) return;
    if (!await confirmDanger("관리 목록에서 제거", [["프로젝트", `<b>${esc(p.alias)}</b>`], ["경로", `<code>${esc(p.path)}</code>`], ["되돌리기", "폴더는 삭제되지 않습니다 — 다시 등록하면 됩니다"]], "제거")) return;
    try { await api("DELETE", `/api/projects/${b.dataset.rm}`); window.wsflowUI.clearProject(b.dataset.rm); if (state.current === b.dataset.rm) state.current = null; await loadAll(); } catch (er) { fail(er); }
  });
}

async function select(id, tab) {
  $('#btnCalendar').classList.remove('on');
  state.current = id; state.view = "project"; if (tab) state.tab = tab;
  $("#btnDash").classList.remove("on");
  renderList(); await renderProject();
}

// ------------------------------------------------------------- 프로젝트 화면
function cur() { return state.projects.find(p => p.id === state.current); }

async function renderProject() {
  const project=cur();if(!project)return;
  const tabs=window.wsflowUI.tabs();
  let selected=tabs.find(tab=>tab.id===state.tab)||tabs[0];
  if(selected?.gitOnly&&project.git!=='repo')selected=tabs.find(tab=>!tab.gitOnly);
  state.tab=selected?.id||null;
  $('#content').innerHTML=`<h2 style="margin:.2rem 0 .1rem">${esc(project.alias)} <span class="muted" style="font-size:.8rem;font-weight:400">${esc(project.path)}</span></h2><div id="projBadges">${badges(project)}</div><div class="tabs" style="margin-top:.6rem">${tabs.map(tab=>`<button class="${state.tab===tab.id?'on':''}" data-tab="${esc(tab.id)}" ${tab.gitOnly&&project.git!=='repo'?'disabled title="git 저장소가 아닙니다"':''}>${esc(tab.label)}</button>`).join('')}</div><div id="tabBody"><p class="muted">불러오는 중…</p></div>`;
  $('#content').querySelectorAll('.tabs [data-tab], #projBadges [data-tab]').forEach(button=>button.onclick=()=>{state.tab=button.dataset.tab;renderProject();});
  if(!selected){$('#tabBody').innerHTML='<p>활성 기능 모듈이 없습니다. 모듈 관리에서 기능을 추가하세요.</p>';return;}
  try{await selected.render($('#tabBody'),project);}catch(error){$('#tabBody').innerHTML=`<pre class="bad">${esc(error.message)}\n${esc(error.data?.stderr||'')}</pre>`;}
}

async function refreshCurrent() { await loadAll(); await renderProject(); }

// ------------------------------------------------------------- 대시보드
// 「주의」 요약 — 목록 요약(git)과 Jira 연동 상태만으로 셀 수 있는 것. 칩을 누르면 해당 프로젝트로 간다.
async function renderDashboard() {
  $('#btnCalendar').classList.remove('on');
  state.view='dashboard';state.current=null;renderList();$('#btnDash').classList.add('on');
  const content=$('#content'), workspaceUI=window.wsflowUI.get('workspace-operations');
  if(workspaceUI)return workspaceUI.dashboard(content);
  const workspaceStatus=moduleActive('workspace-operations')?'워크스페이스 운영 화면 미준비':'워크스페이스 운영 모듈 비활성';
  content.innerHTML=`<h2>대시보드</h2><p>등록된 프로젝트 ${state.projects.length}개 · ${workspaceStatus}</p><button id="dashboardModuleManager">모듈 관리</button><div id="moduleWorkflow"></div>`;
  $('#dashboardModuleManager').onclick=()=>renderModules().catch(fail);
  const workUI=window.wsflowUI.get('work-calendar');
  if(workUI){try{const data=await api('GET','/api/v1/workflow/status');if($('#moduleWorkflow')){$('#moduleWorkflow').innerHTML=workUI.workflowDashboard(data);workUI.bindWorkflow(content);}}catch(error){if($('#moduleWorkflow'))$('#moduleWorkflow').textContent=error.message;}}
}

// ------------------------------------------------------------- 헤더
document.addEventListener("click", e => {
  document.querySelectorAll("details.menu[open]").forEach(m => { if (!m.contains(e.target)) m.removeAttribute("open"); });
});
const closeMenus = () => document.querySelectorAll("details.menu[open]").forEach(m => m.removeAttribute("open"));
// 대화상자를 여는 버튼은 메뉴를 닫는다. 입력을 받는 버튼(추가·등록·찾아보기)은 성공했을 때 닫는다.
["btnScan", "btnNewProj", "btnDeploy", "btnLocks", "btnDelRoot"].forEach(id => $("#" + id).addEventListener("click", () => setTimeout(closeMenus, 0)));
$('#btnScan').onclick=()=>window.wsflowUI.invoke('workspace-operations','scan').catch(fail);
$('#btnLocks').onclick=()=>window.wsflowUI.invoke('workspace-operations','locks').catch(fail);
$('#btnDash').onclick=()=>renderDashboard().catch(fail);$('#btnNotices').onclick=noticesDialog;
$('#btnCalendar').onclick=()=>window.wsflowUI.invoke('work-calendar','calendar').catch(fail);
$('#btnModules').onclick=()=>renderModules().catch(fail);
$('#btnNewProj').onclick=()=>window.wsflowUI.invoke('workspace-operations','newProject').catch(fail);$('#btnDeploy').onclick=()=>window.wsflowUI.invoke('workspace-operations','deploy').catch(fail);
$("#btnRefresh").onclick = async () => { await loadAll(); if (state.current) renderProject(); };
loadAll().catch(e => e.status === 403 ? showBlocked(e) : fail(e));
</script>
</body>
</html>
