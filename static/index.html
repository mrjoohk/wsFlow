<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wsFlow</title>
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --fg:#1f2328; --muted:#6b7280; --line:#e2dfd7; --accent:#2f5d8a; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --chip:#eef2f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:.6rem; align-items:center; padding:.5rem .9rem; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0 .6rem 0 0; }
  main { flex:1; display:grid; grid-template-columns:300px 1fr; min-height:0; }
  aside { border-right:1px solid var(--line); background:var(--panel); overflow:auto; }
  section#content { overflow:auto; padding:1rem 1.2rem; }
  button { font:inherit; padding:.28rem .7rem; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; }
  button:hover { border-color:var(--accent); } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  /* danger = 이 PC 밖에 쓰거나(push·Jira) 덮어쓰는(배포) 동작, 그리고 제거. primary 는 패널당 하나 — 앞으로 가는 동작. */
  button.danger { background:var(--bad); color:#fff; border-color:var(--bad); } button.danger:hover { border-color:#7f1d1d; background:#a51616; }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button.hasBad { border-color:var(--bad); color:var(--bad); font-weight:600; }
  input, select, textarea { font:inherit; padding:.28rem .5rem; border:1px solid var(--line); border-radius:5px; background:#fff; }
  input[type=text] { min-width:14rem; } textarea { width:100%; min-height:6rem; font-family:ui-monospace,Consolas,monospace; font-size:.9rem; }
  .panel { border:1px solid var(--line); border-radius:6px; padding:.7rem .9rem; background:#fbfaf7; }
  .panel h3 { margin:.1rem 0 .6rem; font-size:.95rem; }
  .panel label { margin-right:.7rem; white-space:nowrap; }
  .card { padding:.55rem .8rem; border-bottom:1px solid var(--line); cursor:pointer; display:flex; flex-direction:column; gap:.15rem; }
  .card:hover { background:#f8f7f3; } .card.active { background:#eaf1f8; border-left:3px solid var(--accent); }
  .card .row { display:flex; justify-content:space-between; align-items:center; gap:.4rem; }
  .card .name { font-weight:600; } .card .path { color:var(--muted); font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .x { border:none; background:none; color:var(--muted); padding:0 .2rem; } .card .x:hover { color:var(--bad); }
  .chip { display:inline-block; padding:0 .45rem; border-radius:999px; font-size:.84rem; background:var(--chip); margin-right:.15rem; white-space:nowrap; }
  .chip.bad { background:#fde8e8; color:var(--bad); } .chip.warn { background:#fdf0e1; color:var(--warn); } .chip.ok { background:#e5f5ea; color:var(--ok); }
  .tabs { display:flex; gap:.2rem; border-bottom:1px solid var(--line); margin-bottom:1rem; }
  .tabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; padding:.4rem .8rem; }
  .tabs button.on { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
  .tblwrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:.86rem; } table textarea { min-height:2.8rem; } th, td { border:1px solid var(--line); padding:.3rem .5rem; text-align:left; vertical-align:top; } th { background:#f1efe9; }
  tr.click:hover { background:#f8f7f3; cursor:pointer; }
  pre { background:#f1efe9; padding:.6rem .8rem; border-radius:6px; font-size:.82rem; white-space:pre-wrap; word-break:break-all; max-height:20rem; overflow:auto; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:.8rem 1rem; margin-bottom:1rem; }
  .box h3 { margin:0 0 .5rem; font-size:.95rem; } .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  .filelist { max-height:16rem; overflow:auto; font-family:ui-monospace,Consolas,monospace; font-size:.82rem; }
  .filelist label { display:block; padding:.05rem 0; } .code { display:inline-block; width:1.2rem; color:var(--muted); }
  .muted { color:var(--muted); } .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  button.linkish { border:none; background:none; color:var(--accent); padding:0 .2rem; text-decoration:underline; }
  .chip[data-tab] { cursor:pointer; } .chip[data-tab]:hover { outline:1px solid var(--accent); }
  #toast { position:fixed; right:1rem; bottom:1rem; background:#1f2328; color:#fff; padding:.5rem .9rem; border-radius:6px; opacity:0; transition:opacity .2s; max-width:40rem; white-space:pre-wrap; z-index:20; }
  #toast.show { opacity:.95; }
  dialog { border:1px solid var(--line); border-radius:8px; padding:1rem 1.2rem; width:min(820px,92vw); max-height:85vh; }
  dialog::backdrop { background:rgba(0,0,0,.25); }
  .actions { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; margin:.4rem 0; }
  /* 헤더 — 세 무리(추가 · 도구 · 이동)로 접는다. 14개 평면 나열은 무엇이 중요한지 말해 주지 않는다. */
  .hlabel { display:inline-flex; align-items:center; gap:.35rem; color:var(--muted); font-size:.85rem; }
  .hlabel select { max-width:22rem; }
  details.menu { position:relative; }
  details.menu > summary { list-style:none; cursor:pointer; padding:.28rem .7rem; border:1px solid var(--line); border-radius:5px; background:#fff; user-select:none; }
  details.menu > summary::-webkit-details-marker { display:none; } details.menu > summary::after { content:" ▾"; color:var(--muted); }
  details.menu[open] > summary { border-color:var(--accent); }
  .menuBody { position:absolute; top:calc(100% + .3rem); left:0; z-index:15; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 20px rgba(0,0,0,.12); padding:.5rem .7rem; min-width:34rem; display:flex; flex-direction:column; gap:.4rem; }
  .menuRow { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; } .menuRow > b { min-width:6.5rem; font-weight:600; font-size:.85rem; color:var(--muted); }
  .menuRow.sep { border-top:1px solid var(--line); padding-top:.5rem; margin-top:.2rem; }
  .menuRow input[type=text] { min-width:10rem; flex:1; }
  button.nav.on { border-color:var(--accent); color:var(--accent); font-weight:600; background:#eaf1f8; }
  .calendar-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,350px); gap:1rem; align-items:start; }
  .calendar-toolbar { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin:.6rem 0; }
  .cal-week { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
  .cal-week [role=columnheader] { text-align:center; padding:.4rem; color:var(--muted); }
  .cal-day { min-width:0; min-height:128px; text-align:left; border-radius:0; padding:.4rem; display:flex; flex-direction:column; gap:.25rem; background:var(--panel); }
  .cal-day.outside { background:#f0efeb; color:var(--muted); }
  .cal-day[aria-selected=true] { background:#eaf1f8; box-shadow:inset 0 0 0 2px var(--accent); }
  .cal-day.today .cal-date { text-decoration:underline; font-weight:700; }
  .cal-event { display:block; border-left:3px solid var(--accent); padding-left:.3rem; font-size:.77rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .cal-counts { margin-top:auto; font-size:.72rem; color:var(--muted); }
  .cal-detail { min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:1rem; }
  .cal-detail h3 { margin:.8rem 0 .4rem; font-size:.95rem; }
  .cal-entry { border-top:1px solid var(--line); padding:.6rem 0; overflow-wrap:anywhere; }
  .cal-entry p { margin:.25rem 0; white-space:pre-wrap; }
  #calendarEditor label { display:block; margin:.5rem 0; } #calendarEditor input:not([type=checkbox]), #calendarEditor select { max-width:100%; }
  #calendarEditor [data-field=title] { width:100%; } .cal-editor-times { display:flex; flex-wrap:wrap; gap:.7rem; }
  @media(max-width:1150px){ .calendar-layout{grid-template-columns:1fr;} }
  @media(max-width:600px){ .cal-day{min-height:112px;padding:.25rem;} .cal-counts{font-size:.65rem;} section#content{padding:.65rem;} .cal-event{font-size:.7rem;} }
  @media (max-width:800px){ main{grid-template-columns:1fr;} aside{max-height:35vh;} }
</style>
</head>
<body>
<header>
  <h1>wsFlow</h1>
  <label class="hlabel">루트 <select id="rootSel" title="워크스페이스 루트 — 스캔·새 프로젝트·배포의 기준 폴더"></select></label>
  <details class="menu" id="menuAdd">
    <summary>＋ 추가</summary>
    <div class="menuBody">
      <div class="menuRow"><b>루트에서 찾기</b><button id="btnScan" title="선택한 루트 아래 폴더를 나열해 등록">루트 스캔…</button></div>
      <div class="menuRow"><b>루트 추가</b><input type="text" id="rootInput" placeholder="경로 (예: K:\01.workspace\AI_workspace)"><button id="btnPickRoot" title="탐색기에서 폴더를 골라 루트로 추가">찾아보기…</button><button id="btnAddRoot">추가</button></div>
      <div class="menuRow"><b>프로젝트 등록</b><input type="text" id="projInput" placeholder="프로젝트 폴더 경로"><button id="btnPickProj" title="탐색기에서 폴더를 골라 프로젝트로 등록">찾아보기…</button><button id="btnAddProj">등록</button></div>
      <div class="menuRow"><b>새 프로젝트</b><button id="btnNewProj" title="선택한 루트 아래에 빈 프로젝트 폴더를 만들고 등록">빈 폴더 만들기…</button></div>
      <div class="menuRow sep"><b>루트 관리</b><button id="btnDelRoot" class="danger" title="선택한 루트를 목록에서 제거(폴더는 그대로)">선택한 루트 제거</button></div>
    </div>
  </details>
  <details class="menu" id="menuTools">
    <summary>도구</summary>
    <div class="menuBody">
      <div class="menuRow"><button id="btnDeploy" title="폴더/파일을 체크한 프로젝트들에 복사(항상 덮어쓰기)">배포…</button><span class="muted">폴더/파일을 여러 프로젝트에 복사</span></div>
      <div class="menuRow"><button id="btnLocks" title="등록 저장소의 .git/*.lock 잔류 검사">lock 검사…</button><span class="muted">.git/*.lock 잔류 검사·정리</span></div>
    </div>
  </details>
  <button id="btnDash" class="nav">대시보드</button>
  <button id="btnCalendar" class="nav">캘린더</button>
  <span style="flex:1"></span>
  <button id="btnNotices" title="최근 알림·오류 다시 보기">알림</button>
  <button id="btnRefresh" title="목록과 현재 화면을 다시 읽습니다" aria-label="새로고침">↻</button>
</header>
<main>
  <aside id="list"></aside>
  <section id="content"><p class="muted">왼쪽에서 프로젝트를 고르거나, 루트를 추가하고 "루트 스캔"으로 등록하세요.</p></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state = { roots: [], projects: [], current: null, tab: "status", view: "project", jira: {} };

// F-004: 기동 시 난수 토큰. 주소의 ?t= 에서 받아 모든 API 요청 헤더에 실어 보낸다.
// 다른 출처의 페이지는 이 값을 읽을 수 없으므로 요청을 위조하지 못한다.
const AUTH_TOKEN = new URLSearchParams(location.search).get("t") || "";

async function api(method, path, body) {
  const headers = { "X-Auth-Token": AUTH_TOKEN };
  if (body) headers["Content-Type"] = "application/json";
  const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) { const e = new Error(data.error || r.statusText); e.data = data; e.status = r.status; throw e; }
  return data;
}
// 토큰 없이(또는 재시작 뒤 옛 북마크로) 열렸다 — 3.5초 toast 로는 원인을 알 수 없으므로
// 화면 전체로 이유와 할 일을 적는다(F-001 의 UX 짝).
function showBlocked(e) {
  $("#list").innerHTML = "";
  document.querySelectorAll("header button, header input, header select").forEach(el => el.disabled = true);
  $("#content").innerHTML = `
    <div class="box" style="max-width:42rem;margin:2rem auto">
      <h2 style="margin-top:0">이 주소로는 열 수 없습니다</h2>
      <p class="bad">${esc(e.message)}</p>
      <p>wsFlow 는 <b>기동할 때마다 새 토큰</b>을 만들고 콘솔에 <code>http://127.0.0.1:포트/?t=…</code> 형태로 찍습니다.
         그래서 <b>북마크한 주소는 다음 기동부터 통하지 않습니다.</b></p>
      <p>run.cmd(또는 <code>python run.py</code>)를 띄운 콘솔 창에 표시된 주소를 복사해 다시 여십시오.
         토큰 없이 열면 다른 웹페이지가 이 PC 의 git·Jira 를 조작하는 것을 막을 수 없어 API 가 거부합니다.</p>
    </div>`;
}
// 비동기 동작 중 버튼을 잠근다 — 같은 요청이 두 번 나가면 메모 저장은 가짜 409(UX-08),
// 승인은 중복 기록이 된다. 끝나면(성공·실패 모두) 원래대로 돌린다.
async function busy(btn, fn, label) {
  if (!btn) return fn();
  const was = btn.textContent; btn.disabled = true; if (label) btn.textContent = label;
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = was; }
}
// toast 는 3.5초 뒤 사라진다 — 오류를 다시 볼 수 있도록 최근 알림을 모아 두고 헤더 「알림」으로 연다(UX-35).
const notices = [];
function notice(kind, msg, detail) {
  notices.unshift({ at: new Date().toTimeString().slice(0, 8), kind, msg, detail: detail || "" });
  if (notices.length > 30) notices.pop();
  const b = $("#btnNotices"); if (b) { const n = notices.filter(x => x.kind === "bad").length; b.textContent = n ? `알림 ${n}` : "알림"; b.classList.toggle("hasBad", !!n); }
}
function toast(msg, ms=3500) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); notice("info", msg); }
function fail(e) {
  const detail = e.data?.stderr || (e.data && Object.keys(e.data).length > 1 ? JSON.stringify(e.data, null, 1) : "");
  const t = $("#toast"); t.textContent = "오류: " + e.message + (e.data?.stderr ? "\n" + e.data.stderr.slice(0, 600) : ""); t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3500);
  notice("bad", "오류: " + e.message, detail); console.error(e);
}
function noticesDialog() {
  const dlg = $("#dlg");
  dlg.innerHTML = `<h3 style="margin-top:0">최근 알림 <span class="muted" style="font-weight:400;font-size:.85rem">(이 탭을 연 뒤 ${notices.length}건)</span></h3>
    ${notices.length ? `<div style="max-height:60vh;overflow:auto">${notices.map(n => `<div class="box" style="padding:.5rem .8rem;margin-bottom:.5rem"><span class="muted">${esc(n.at)}</span> <span class="${n.kind === "bad" ? "bad" : ""}">${esc(n.msg)}</span>${n.detail ? `<pre style="margin:.4rem 0 0;max-height:10rem">${esc(n.detail)}</pre>` : ""}</div>`).join("")}</div>` : '<p class="muted">알림이 없습니다.</p>'}
    <div class="actions" style="justify-content:flex-end"><button id="dlgClear">비우기</button><button id="dlgClose" class="primary">닫기</button></div>`;
  dlg.showModal();
  $("#dlgClose").onclick = () => dlg.close();
  $("#dlgClear").onclick = () => { notices.length = 0; const b = $("#btnNotices"); b.textContent = "알림"; b.classList.remove("hasBad"); dlg.close(); };
}

// ------------------------------------------------------------- 공용 확인 대화상자
// 브라우저 confirm()/prompt() 대신 쓴다 — 무엇을·어디에·되돌릴 수 있는지를 한 자리에 적고,
// 위험한 버튼은 danger 로 구분한다. Esc 는 null(취소).
function ask({ title, body = "", buttons }) {
  return new Promise(resolve => {
    const dlg = $("#dlg");
    dlg.innerHTML = `<h3 style="margin-top:0">${esc(title)}</h3>${body ? `<div>${body}</div>` : ""}
      <div class="actions" style="justify-content:flex-end;margin-top:.8rem">${buttons.map((b, i) => `<button data-ask="${i}" class="${b.kind || ""}">${esc(b.label)}</button>`).join("")}</div>`;
    const done = v => { dlg.onclose = null; dlg.close(); resolve(v); };
    dlg.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => done(buttons[+b.dataset.ask].value));
    dlg.onclose = () => { dlg.onclose = null; resolve(null); };
    dlg.showModal();
    const first = dlg.querySelector("button.primary") || dlg.querySelector("[data-ask]");
    if (first) first.focus();
  });
}
// 위험 작업 확인 — 제목·대상·되돌릴 수 있는지를 같은 판형으로 묻는다. 실행 버튼은 danger.
function confirmDanger(title, rows, okLabel = "실행") {
  return ask({ title,
    body: `<table style="margin:.3rem 0 .6rem">${rows.map(([k, v]) => `<tr><th style="width:8rem">${esc(k)}</th><td>${v}</td></tr>`).join("")}</table>`,
    buttons: [{ label: "취소", value: false }, { label: okLabel, value: true, kind: "danger" }] });
}
</script>
<script id="ui-pure">
// ------------------------------------------------------------- 순수 함수 (DOM 없음)
// 이 블록은 tests/test_ui.py 가 node 로 그대로 실행한다 — 화면 상태 규칙을 시험하기 위해
// DOM 에 닿지 않는 함수만 둔다.
const KEYRE = /^\s*[-*]\s*([A-Z][A-Z0-9_]*-\d+)\s*:\s*(.*)$/;

function ymdToday() {
  const d = new Date(), z = n => String(n).padStart(2, "0");
  return z(d.getFullYear() % 100) + z(d.getMonth() + 1) + z(d.getDate());
}
// 키 줄만 떼어내고 나머지는 원문 그대로 둔다 — 사람이 직접 쓴 줄을 잃지 않는다.
function splitMemo(text) {
  const by = {}, rest = [];
  (text || "").split("\n").forEach(ln => {
    const m = KEYRE.exec(ln);
    if (m) { (by[m[1]] = by[m[1]] || []).push(m[2]); } else { rest.push(ln); }
  });
  return { by, rest: rest.join("\n").replace(/^\n+|\n+$/g, "") };
}
function joinMemo(by, rest) {
  const lines = [];
  Object.keys(by).sort().forEach(k => (by[k] || []).forEach(t => { if (t.trim()) lines.push(`- ${k}: ${t.trim()}`); }));
  const tail = (rest || "").trim();
  return lines.join("\n") + (tail ? (lines.length ? "\n" : "") + tail : "");
}
// Jira 화면 상태는 **프로젝트마다 하나**다(UX-02). 전역 하나를 쓰면 A 에서 조회한 표가
// B 아래에 그려지고, 그 뒤의 409·"원본에 없는 키"는 원인과 무관한 문구가 된다.
function jiraFor(map, id, ymd = null, home = "") {
  if (!map.has(id)) map.set(id, { info: null, view: null, memo: null, plan: null, loadedAt: null,
                                  dirty: false, draft: null, savedAt: null, cfg: null, disc: null,
                                  ymd: null, documents: new Map() });
  const parent = map.get(id);

  $('#cStatus').textContent=CAL.error?'확인 불가: '+CAL.error:!CAL.data?'기록을 읽는 중…':CAL.data.complete?'저장된 기록을 확인했습니다.':'일부 기록을 확인하지 못했습니다. ?는 확인이 필요한 건수입니다.';
  if(CAL.data){const sources=CAL.data.sources.filter(s=>s.kind==='google');if(sources.length)$('#cStatus').textContent+=' Google: '+sources.map(s=>s.name+' · '+(s.complete?'확인':'확인 필요')+' · '+(s.last_sync||'미수집')).join(' / ');}
  const cell=date=>{
    if(date<'2000-01-01'||date>'2099-12-31')return '<div role="gridcell" aria-disabled="true"></div>';
    const day=byDay.get(date),view=day?calendarCell(day):null,selected=date===CAL.selected;
    return `<button class="cal-day ${date.slice(0,7)!==CAL.selected.slice(0,7)?'outside':''} ${date===today?'today':''}" role="gridcell" data-date="${date}" aria-selected="${selected}" tabindex="${selected?0:-1}" aria-label="${date} 일정 ${day?.event_count??'?'} · 업무 ${day?.task_count??'?'} · 메모 ${day?.memo_count??'?'}"><span class="cal-date">${+date.slice(-2)}${date===today?' · 오늘':''}</span>
      ${view?view.events.map(e=>`<span class="cal-event">${e.all_day?'종일':calendarDateAt(e.start_at)!==date?'이어짐':calendarTime(e.start_at)} ${esc(e.title)}</span>`).join(''):''}
      ${view?.overflow?`<span class="muted">일정 +${view.overflow}</span>`:''}<span class="cal-counts">업무 ${day?.task_count??'?'} · 메모 ${day?.memo_count??'?'}</span></button>`;
  };
  let rows='<div class="cal-week" role="row">'+['월','화','수','목','금','토','일'].map(d=>`<span role="columnheader">${d}</span>`).join('')+'</div>';
  for(let i=0;i<range.dates.length;i+=7)rows+='<div class="cal-week" role="row">'+range.dates.slice(i,i+7).map(cell).join('')+'</div>';
  $('#cGrid').innerHTML=rows;
  $('#cGrid').querySelectorAll('[data-date]').forEach(button=>{
    button.onclick=()=>selectCalendarDate(button.dataset.date);
    button.onkeydown=e=>{const moves={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};if(!(e.key in moves))return;e.preventDefault();selectCalendarDate(calendarClamp(calendarAdd(button.dataset.date,moves[e.key])));};
  });
  const day=byDay.get(CAL.selected),detail=$('#cDetail');
  const entry=(body,meta)=>`<div class="cal-entry">${body}<small class="muted">${esc(meta)}</small></div>`;
  detail.innerHTML=`<h2 style="margin:0;font-size:1.1rem">${esc(CAL.selected)}</h2><div class="actions"><button id="cAddEvent">일정 추가</button><button id="cAddNote">메모 추가</button></div>
    ${!day?`<p class="muted">${CAL.error?'기록을 확인할 수 없습니다.':'기록을 읽는 중입니다.'}</p>`:`${!day.complete?'<p class="warn">일부 출처 확인 불가</p>':''}
    <h3>일정 ${day.event_count??'?'}</h3>${day.events.map(e=>entry(`<b>${esc(e.title)}</b><p>${e.all_day?esc(e.start_date+' ~ '+e.end_date+' (종료일 제외)'):esc(calendarDateAt(e.start_at)+' '+calendarTime(e.start_at)+' ~ '+calendarDateAt(e.end_at)+' '+calendarTime(e.end_at))}</p>${e.location?`<p>${esc(e.location)}</p>`:''}<p>${esc(e.body)}</p>${e.origin==='google'?'<span class="muted">Google 읽기 전용</span>':`<button data-edit="${esc(e.id)}">수정·삭제</button>${e.google_link?`<p class="muted">Google · ${esc(e.google_link.calendar_id)} · ${esc(googleState(e.sync_status))}</p>`:`<button data-gpublish="${esc(e.id)}">Google에 추가</button>`}`}`,e.origin==='google'?'Google · '+e.calendar_name+' · '+e.access_role:calendarNames(e.project_ids,e.unavailable_project_ids)+(e.google_link?' · Google 연결 일정':' · 로컬에만 저장'))).join('')||'<p class="muted">확인된 일정이 없습니다.</p>'}
    <h3>수행 업무 ${day.task_count??'?'}</h3>${day.tasks.map(t=>entry(`<b>${esc(t.summary||t.key)}</b>${t.records.map(r=>`<p>${esc(r.text)}</p>`).join('')}`,calendarNames(t.project_ids)+' · 기존 일지')).join('')||'<p class="muted">저장된 업무 기록이 없습니다.</p>'}
    <h3>메모 ${day.memo_count??'?'}</h3>${day.memos.map(m=>entry(`<p>${esc(m.kind==='note'?m.body:[...(m.common||[]),...(m.marks||[]).map(x=>x.mark+' '+x.text)].join('\n'))}</p>${m.kind==='note'?`<button data-edit="${esc(m.id)}">수정·삭제</button>`:''}`,calendarNames(m.project_ids,m.unavailable_project_ids)+(m.kind==='note'?' · 로컬 메모':' · 기존 공통 메모 묶음'))).join('')||'<p class="muted">저장된 메모가 없습니다.</p>'}`}`;
  $('#cAddEvent').onclick=()=>openCalendarEditor('event');$('#cAddNote').onclick=()=>openCalendarEditor('note');
  detail.querySelectorAll('[data-gpublish]').forEach(b=>b.onclick=()=>googlePublish(day.events.find(e=>e.id===b.dataset.gpublish)));
  detail.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=[...day.events,...day.memos].find(r=>r.id===b.dataset.edit);openCalendarEditor(r.kind,r);});calendarDrafts();
}
function selectCalendarDate(date) {
  CAL.selected=date;const range=calendarRange(date,CAL.mode);
  if(!CAL.data||range.start!==CAL.data.query.start||range.end!==CAL.data.query.end)loadCalendar(true);
  else {drawCalendar();$(`[data-date="${date}"]`)?.focus();}
}
function openCalendarEditor(kind, record=null, savedKey=null) {
  const key=savedKey||(record?record.id:`new:${kind}:${CAL.selected}`);
  if(!CAL.drafts.has(key))CAL.drafts.set(key,{kind,id:record?.id||null,expected_revision:record?.revision||null,unavailable:record?.unavailable_project_ids||[],revision:0,dirty:false,plan:null,pending:null,destination:'',googleLink:record?.google_link||null,
    payload:record?Object.fromEntries(Object.entries(record).filter(([key])=>['title','body','location','project_ids','all_day','start_date','end_date','start_at','end_at','timezone','date'].includes(key))):kind==='note'?{date:CAL.selected,body:'',project_ids:CAL.projectId?[CAL.projectId]:[]}:{title:'',body:'',location:'',all_day:true,start_date:CAL.selected,end_date:calendarAdd(CAL.selected,1),project_ids:CAL.projectId?[CAL.projectId]:[]}});
  const d=CAL.drafts.get(key),p=d.payload,dlg=$('#dlg');CAL.editor=key;
  const timedStart=p.start_at?calendarInputTime(p.start_at):(p.start_date||CAL.selected)+'T09:00',timedEnd=p.end_at?calendarInputTime(p.end_at):(p.start_date||CAL.selected)+'T10:00';
  const links=[...new Set([...state.projects.map(p=>p.id),...p.project_ids])];
